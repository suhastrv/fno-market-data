name: Fetch filings index
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pilot (5 companies) or all (NIFTY 500)'
        default: 'pilot'
concurrency:
  group: filings
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build filings index
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          cat > filings.js <<'JS'
          // Builds a links-only index of NSE filings per company. No PDFs are copied.
          const fs = require('fs');
          const path = require('path');
          const BASE = process.env.NSE_BASE || 'https://www.nseindia.com';
          const ARCH = process.env.LIST_URL || 'https://archives.nseindia.com/content/indices/ind_nifty500list.csv';
          const OUT = process.env.OUT_DIR || 'data/filings';
          const MODE = process.env.MODE || 'pilot';
          const PILOT = ['TCS', 'INFY', 'HDFCBANK', 'ASIANPAINT', 'PERSISTENT'];
          const UA = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36', 'Accept': 'application/json,text/html,*/*', 'Accept-Language': 'en-US,en;q=0.9' };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let cookie = '';
          async function seed() {
            try {
              const r = await fetch(BASE, { headers: UA });
              cookie = (r.headers.getSetCookie ? r.headers.getSetCookie() : []).map(c => c.split(';')[0]).join('; ');
            } catch (e) { console.log('cookie seed failed: ' + e.message); }
          }
          async function getJson(p) {
            for (let i = 0; i < 3; i++) {
              let why = '';
              try {
                const r = await fetch(BASE + p, { headers: Object.assign({}, UA, { Cookie: cookie, Referer: BASE + '/' }), redirect: 'follow' });
                const t = await r.text();
                if (r.ok) {
                  try { return JSON.parse(t); } catch (e) { why = 'HTTP ' + r.status + ' but not JSON: ' + t.slice(0, 80).replace(/\s+/g, ' '); }
                } else {
                  why = 'HTTP ' + r.status + ' ' + t.slice(0, 80).replace(/\s+/g, ' ');
                  if (r.status === 401 || r.status === 403) await seed();
                }
              } catch (e) { why = 'error ' + e.message; }
              console.log('  retry ' + (i + 1) + ' ' + p.split('?')[0] + ' -> ' + why + ' (cookie length ' + cookie.length + ')');
              await sleep(800 * (i + 1));
            }
            return null;
          }
          function dmy(d) { return ('0' + d.getDate()).slice(-2) + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + d.getFullYear(); }
          function arr(j) { return Array.isArray(j) ? j : (j && Array.isArray(j.data) ? j.data : []); }
          function yearOf(s) { const m = String(s || '').match(/(20\d\d|19\d\d)/); return m ? +m[1] : null; }
          async function symbols() {
            if (MODE === 'pilot') return PILOT.map(s => ({ symbol: s, name: s }));
            const r = await fetch(ARCH, { headers: UA });
            const t = await r.text();
            const rows = t.split(/\r?\n/).slice(1).filter(Boolean).map(l => l.split(','));
            return rows.map(c => ({ name: c[0], symbol: c[2] })).filter(x => x.symbol);
          }
          const CALLRX = /transcript|audio|recording|con(ference)?\.? ?call|earnings call|analyst|investor meet|presentation|investor pres/i;
          async function one(s) {
            const sym = encodeURIComponent(s.symbol);
            const today = new Date(), start = new Date(today.getFullYear() - 10, 0, 1);
            const ar = arr(await getJson('/api/annual-reports?index=equities&symbol=' + sym));
            const fr = arr(await getJson('/api/corporates-financial-results?index=equities&symbol=' + sym + '&period=Quarterly'));
            const an = arr(await getJson('/api/corporate-announcements?index=equities&symbol=' + sym + '&from_date=' + dmy(start) + '&to_date=' + dmy(today)));
            const annual = ar.map(x => ({ fromYr: x.fromYr, toYr: x.toYr, type: x.submission_type, link: x.fileName }));
            const results = fr.map(x => ({ quarterEnd: x.toDate, period: x.period, audited: x.audited, filed: x.broadcastDate, link: x.xmlFileName || x.xbrl || x.attachment || null }));
            const calls = an.filter(x => CALLRX.test((x.desc || '') + ' ' + (x.attchmntText || ''))).map(x => ({ date: x.an_dt, subject: x.desc, text: String(x.attchmntText || '').slice(0, 200), link: x.attchmntFile || x.attFilePath || null }));
            const byYear = {};
            function bump(k, y) { if (!y) return; byYear[y] = byYear[y] || {}; byYear[y][k] = (byYear[y][k] || 0) + 1; }
            annual.forEach(x => bump('annual', yearOf(x.toYr || x.fromYr)));
            results.forEach(x => bump('results', yearOf(x.quarterEnd)));
            calls.forEach(x => bump('calls', yearOf(x.date)));
            const ok = ar.length + fr.length + an.length > 0;
            fs.writeFileSync(path.join(OUT, s.symbol + '.json'), JSON.stringify({ symbol: s.symbol, name: s.name, fetchedAt: new Date().toISOString(), annual, results, calls }));
            return { symbol: s.symbol, name: s.name, ok, annual: annual.length, results: results.length, calls: calls.length, byYear };
          }
          (async () => {
            fs.mkdirSync(OUT, { recursive: true });
            await seed();
            const list = await symbols();
            console.log('mode ' + MODE + ', companies ' + list.length);
            const status = [];
            for (let i = 0; i < list.length; i++) {
              if (i && i % 40 === 0) await seed();
              try { const r = await one(list[i]); status.push(r); console.log((r.ok ? 'OK   ' : 'NONE ') + r.symbol + ' annual ' + r.annual + ' results ' + r.results + ' calls ' + r.calls); }
              catch (e) { status.push({ symbol: list[i].symbol, ok: false, error: e.message }); console.log('ERR  ' + list[i].symbol + ' ' + e.message); }
              await sleep(500);
            }
            const good = status.filter(x => x.ok).length;
            if (!good) { console.log('nothing fetched; leaving old files'); process.exit(1); }
            fs.writeFileSync(path.join(OUT, 'status.json'), JSON.stringify({ updatedAt: new Date().toISOString(), mode: MODE, companies: status }));
            const lines = ['symbol,name,annual_reports,quarterly_results,call_or_presentation_filings'].concat(status.map(x => [x.symbol, '"' + (x.name || '').replace(/"/g, '') + '"', x.annual || 0, x.results || 0, x.calls || 0].join(',')));
            fs.writeFileSync(path.join(OUT, 'status.csv'), lines.join('\n'));
            console.log('done: ' + good + ' of ' + status.length + ' had data');
          })();
          JS
          node filings.js
      - name: Commit results
        run: |
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add data/filings
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update filings index"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
