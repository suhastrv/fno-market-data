name: Extract filing text
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Company symbols, comma separated'
        default: 'TCS'
      quarters:
        description: 'How many recent quarters of each document type'
        default: '6'
      annual:
        description: 'Also fetch latest annual report (yes or no)'
        default: 'no'
concurrency:
  group: extract
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make sure pdftotext exists
        run: |
          which pdftotext || (sudo apt-get update -y && sudo apt-get install -y poppler-utils)
          pdftotext -v 2>&1 | head -1
      - name: Download and extract
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
          QUARTERS: ${{ github.event.inputs.quarters }}
          ANNUAL: ${{ github.event.inputs.annual }}
        run: |
          cat > extract.js <<'JS'
          // Downloads selected filings (PDFs) for chosen companies and extracts text. Records every success and failure.
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const IN = process.env.DATA_DIR || 'data/filings';
          const OUT = process.env.OUT_DIR || 'data/filings_text';
          const SYMS = (process.env.SYMBOLS || 'TCS').split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
          const NQ = parseInt(process.env.QUARTERS || '6', 10);
          const ANNUAL = (process.env.ANNUAL || 'no') === 'yes';
          const MAXCHARS = 600000;
          const UA = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36', 'Accept': 'application/pdf,*/*', 'Accept-Language': 'en-US,en;q=0.9' };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let cookie = '';
          async function seed() {
            try { const r = await fetch(process.env.SEED_URL || 'https://www.nseindia.com', { headers: UA }); cookie = (r.headers.getSetCookie ? r.headers.getSetCookie() : []).map(c => c.split(';')[0]).join('; '); } catch (e) {}
          }
          function ts(d) { const t = Date.parse(String(d || '').slice(0, 11).replace(/-/g, ' ')); return isNaN(t) ? 0 : t; }
          function iso(d) { const t = ts(d); return t ? new Date(t).toISOString().slice(0, 10) : 'unknown'; }
          async function download(url) {
            let last = '';
            for (let i = 0; i < 3; i++) {
              try {
                const r = await fetch(url, { headers: Object.assign({}, UA, { Cookie: cookie, Referer: 'https://www.nseindia.com/' }), redirect: 'follow' });
                if (!r.ok) { last = 'HTTP ' + r.status; if (r.status === 401 || r.status === 403) await seed(); await sleep(1000 * (i + 1)); continue; }
                const buf = Buffer.from(await r.arrayBuffer());
                return { buf, type: r.headers.get('content-type') || '' };
              } catch (e) { last = 'error ' + e.message; await sleep(1000 * (i + 1)); }
            }
            return { error: last };
          }
          function toText(buf, file) {
            fs.writeFileSync(file + '.pdf', buf);
            try { execFileSync('pdftotext', ['-layout', file + '.pdf', file + '.raw.txt'], { timeout: 120000 }); } catch (e) { fs.rmSync(file + '.pdf', { force: true }); return { err: 'pdftotext failed' }; }
            const t = fs.readFileSync(file + '.raw.txt', 'utf8'); fs.rmSync(file + '.pdf', { force: true }); fs.rmSync(file + '.raw.txt', { force: true });
            return { text: t };
          }
          (async () => {
            fs.mkdirSync(OUT, { recursive: true });
            await seed();
            const manifest = [];
            for (const sym of SYMS) {
              const f = path.join(IN, sym + '.json');
              if (!fs.existsSync(f)) { manifest.push({ symbol: sym, status: 'no_index_file' }); console.log('NOFILE ' + sym); continue; }
              const d = JSON.parse(fs.readFileSync(f, 'utf8'));
              const pick = [];
              const take = (list, kind) => list.filter(x => x.link).sort((a, b) => ts(b.date) - ts(a.date)).slice(0, NQ).forEach(x => pick.push({ kind, date: x.date, subject: x.subject || '', link: x.link }));
              take(d.resultAnnouncements || [], 'results');
              take((d.docs || []).filter(x => x.kind === 'transcript'), 'transcript');
              take((d.docs || []).filter(x => x.kind === 'presentation'), 'presentation');
              if (ANNUAL) (d.annual || []).filter(x => x.link).slice(0, 1).forEach(x => pick.push({ kind: 'annual', date: 'Mar-' + (x.toYr || ''), subject: 'Annual report ' + x.fromYr + '-' + x.toYr, link: x.link }));
              const dir = path.join(OUT, sym); fs.mkdirSync(dir, { recursive: true });
              for (const p of pick) {
                const base = iso(p.date) + '_' + p.kind; const file = path.join(dir, base);
                const rec = { symbol: sym, kind: p.kind, date: iso(p.date), subject: p.subject, link: p.link, file: base + '.txt' };
                const r = await download(p.link);
                if (r.error) { rec.status = 'download_failed'; rec.detail = r.error; }
                else if (r.buf.slice(0, 4).toString() !== '%PDF') { rec.status = 'not_a_pdf'; rec.detail = r.type + ' ' + r.buf.slice(0, 40).toString().replace(/\s+/g, ' '); }
                else {
                  const t = toText(r.buf, file);
                  if (t.err) { rec.status = 'extract_failed'; rec.detail = t.err; }
                  else {
                    const clean = t.text.replace(/\f/g, '\n').replace(/[ \t]+\n/g, '\n');
                    rec.chars = clean.length;
                    if (clean.replace(/\s/g, '').length < 400) { rec.status = 'no_text_scanned_image'; rec.detail = 'needs OCR'; }
                    else {
                      let out = clean; if (out.length > MAXCHARS) { out = out.slice(0, MAXCHARS); rec.status = 'ok_truncated'; rec.detail = 'cut at ' + MAXCHARS + ' chars'; } else rec.status = 'ok';
                      fs.writeFileSync(path.join(dir, base + '.txt'), out);
                    }
                  }
                }
                manifest.push(rec);
                console.log((rec.status.startsWith('ok') ? 'OK   ' : 'FAIL ') + sym + ' ' + rec.date + ' ' + p.kind + ' -> ' + rec.status + (rec.detail ? ' (' + rec.detail + ')' : '') + (rec.chars ? ' ' + rec.chars + ' chars' : ''));
                await sleep(600);
              }
            }
            const ok = manifest.filter(m => (m.status || '').startsWith('ok')).length;
            fs.writeFileSync(path.join(OUT, 'manifest.json'), JSON.stringify({ updatedAt: new Date().toISOString(), symbols: SYMS, documents: manifest }, null, 1));
            console.log('done: ' + ok + ' of ' + manifest.length + ' documents extracted');
            if (!ok) process.exit(1);
          })();
          JS
          node extract.js
      - name: Commit results
        run: |
          git config user.name "filings-bot"
          git config user.email "filings-bot@users.noreply.github.com"
          git add data/filings_text
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update extracted filing text"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
